<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockchain Interface</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; }
        h1, h2 { color: #333; }
        .container { max-width: 800px; margin: auto; }
        form { margin-bottom: 2em; }
        input[type="text"] { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #007BFF; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #chain { white-space: pre-wrap; background-color: #f4f4f4; padding: 1em; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Blockchain Interface</h1>

        <h2>Wallet</h2>
        <button id="generate-wallet-button">Generate New Wallet</button>
        <div id="wallet-info" style="margin-top: 10px; display: none;">
            <p><strong>Public Key (Address):</strong> <span id="public-key"></span></p>
            <p><strong>Private Key (KEEP SECRET!):</strong> <span id="private-key"></span></p>
        </div>

        <h2>Check Balance</h2>
        <form id="balance-form">
            <input type="text" id="balance-address" placeholder="Address">
            <button type="submit">Check Balance</button>
        </form>
        <p id="balance-result"></p>

        <h2>Add a New Transaction</h2>
        <form id="transaction-form">
            <input type="text" id="sender" name="sender" placeholder="Sender Public Key" required>
            <input type="text" id="recipient" name="recipient" placeholder="Recipient Address" required>
            <input type="text" id="amount" name="amount" placeholder="Amount" required>
            <input type="text" id="signature" name="signature" placeholder="Signature (Required for non-reward)">
            <button type="submit">Add Transaction</button>
        </form>

        <h2>Difficulty</h2>
        <p>Current Difficulty: <span id="current-difficulty"></span></p>
        <form id="difficulty-form">
            <input type="text" id="new-difficulty" placeholder="New Difficulty">
            <button type="submit">Set Difficulty</button>
        </form>

        <h2>Mine a New Block</h2>
        <button id="mine-button">Mine Block</button>

        <h2>Blockchain</h2>
        <pre id="chain"></pre>
    </div>

    <script>
        const App = {
            init: async () => {
                document.getElementById('transaction-form').addEventListener('submit', App.newTransaction);
                document.getElementById('mine-button').addEventListener('click', App.mine);
                document.getElementById('generate-wallet-button').addEventListener('click', App.generateWallet);
                document.getElementById('balance-form').addEventListener('submit', App.checkBalance);
                document.getElementById('difficulty-form').addEventListener('submit', App.setDifficulty);
                await App.fetchChain();
                await App.fetchDifficulty();
            },

            fetchChain: async () => {
                try {
                    const response = await fetch('/chain');
                    const data = await response.json();
                    document.getElementById('chain').textContent = JSON.stringify(data.chain, null, 2);
                } catch (error) {
                    console.error('Error fetching chain:', error);
                }
            },

            fetchDifficulty: async () => {
                try {
                    const response = await fetch('/difficulty');
                    const data = await response.json();
                    document.getElementById('current-difficulty').textContent = data.difficulty;
                } catch (error) {
                    console.error('Error fetching difficulty:', error);
                }
            },

            setDifficulty: async (event) => {
                event.preventDefault();
                const difficulty = document.getElementById('new-difficulty').value;
                try {
                    const response = await fetch('/difficulty', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ difficulty: Number(difficulty) }),
                    });
                    const data = await response.json();
                    alert(data.message || data);
                    await App.fetchDifficulty();
                } catch (error) {
                    console.error('Error setting difficulty:', error);
                }
            },

            generateWallet: async () => {
                try {
                    const response = await fetch('/wallet/new');
                    const data = await response.json();
                    document.getElementById('public-key').textContent = data.public_key;
                    document.getElementById('private-key').textContent = data.private_key;
                    document.getElementById('wallet-info').style.display = 'block';
                } catch (error) {
                    console.error('Error generating wallet:', error);
                }
            },

            checkBalance: async (event) => {
                event.preventDefault();
                const address = document.getElementById('balance-address').value;
                try {
                    const response = await fetch(`/balance/${address}`);
                    const data = await response.json();
                    document.getElementById('balance-result').textContent = `Balance for ${address}: ${data.balance}`;
                } catch (error) {
                    console.error('Error checking balance:', error);
                }
            },

            newTransaction: async (event) => {
                event.preventDefault();
                const sender = document.getElementById('sender').value;
                const recipient = document.getElementById('recipient').value;
                const amount = document.getElementById('amount').value;
                const signature = document.getElementById('signature').value;

                try {
                    const response = await fetch('/transactions/new', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            sender,
                            recipient,
                            amount: Number(amount),
                            signature: signature || null
                        }),
                    });
                    if (response.ok) {
                        const data = await response.json();
                        alert(data.message);
                        document.getElementById('transaction-form').reset();
                        await App.fetchChain();
                    } else {
                        const error = await response.text();
                        alert('Error: ' + error);
                    }
                } catch (error) {
                    console.error('Error creating transaction:', error);
                }
            },

            mine: async () => {
                try {
                    const response = await fetch('/mine');
                    const data = await response.json();
                    alert(data.message);
                    await App.fetchChain(); // Refresh the chain view
                } catch (error) {
                    console.error('Error mining block:', error);
                }
            }
        };

        window.addEventListener('load', App.init);
    </script>
</body>
</html>
