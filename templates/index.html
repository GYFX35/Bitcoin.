<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockchain Interface</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; }
        h1, h2 { color: #333; }
        .container { max-width: 800px; margin: auto; }
        form { margin-bottom: 2em; }
        input[type="text"] { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #007BFF; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #chain { white-space: pre-wrap; background-color: #f4f4f4; padding: 1em; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Blockchain Interface</h1>

        <h2>Add a New Transaction</h2>
        <form id="transaction-form">
            <input type="text" id="sender" name="sender" placeholder="Sender Address" required>
            <input type="text" id="recipient" name="recipient" placeholder="Recipient Address" required>
            <input type="text" id="amount" name="amount" placeholder="Amount" required>
            <button type="submit">Add Transaction</button>
        </form>

        <h2>Mine a New Block</h2>
        <button id="mine-button">Mine Block</button>

        <h2>Blockchain</h2>
        <pre id="chain"></pre>
    </div>

    <script>
        const App = {
            init: async () => {
                document.getElementById('transaction-form').addEventListener('submit', App.newTransaction);
                document.getElementById('mine-button').addEventListener('click', App.mine);
                await App.fetchChain();
            },

            fetchChain: async () => {
                try {
                    const response = await fetch('/chain');
                    const data = await response.json();
                    document.getElementById('chain').textContent = JSON.stringify(data.chain, null, 2);
                } catch (error) {
                    console.error('Error fetching chain:', error);
                }
            },

            newTransaction: async (event) => {
                event.preventDefault();
                const sender = document.getElementById('sender').value;
                const recipient = document.getElementById('recipient').value;
                const amount = document.getElementById('amount').value;

                try {
                    const response = await fetch('/transactions/new', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sender, recipient, amount: Number(amount) }),
                    });
                    const data = await response.json();
                    alert(data.message);
                    document.getElementById('transaction-form').reset();
                } catch (error) {
                    console.error('Error creating transaction:', error);
                }
            },

            mine: async () => {
                try {
                    const response = await fetch('/mine');
                    const data = await response.json();
                    alert(data.message);
                    await App.fetchChain(); // Refresh the chain view
                } catch (error) {
                    console.error('Error mining block:', error);
                }
            }
        };

        window.addEventListener('load', App.init);
    </script>
</body>
</html>
